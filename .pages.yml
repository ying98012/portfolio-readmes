media:
  - name: uploads
    label: Uploads
    input: assets/uploads
    output: /uploads
  - name: project_markdowns
    label: 匯入 Markdown
    input: _projects
    output: /_projects
    extensions: [md]
    rename: false

content:
  - name: home
    label: Home
    type: file
    path: index.md
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: heroEyebrow
        label: Hero Eyebrow
        type: string
        required: true
      - name: heroDescription
        label: Hero Description
        type: text
        required: true
      - name: primaryButtonLabel
        label: Primary Button Label
        type: string
        required: true
      - name: primaryButtonUrl
        label: Primary Button URL
        type: string
        required: true
      - name: listTitle
        label: List Title
        type: string
        required: true
      - name: listDescription
        label: List Description
        type: text
        required: true
      - name: body
        label: Notes
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename:
      template: "{fields.slug}.md"
      field: true
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, updatedAt]
      primary: title
      sort: [updatedAt, desc]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: updatedAt
        label: Updated At
        type: date
        required: true
      - name: summary
        label: Summary (optional)
        type: text
      - name: projectUrl
        label: Portfolio Project URL (optional)
        type: string
      - name: techStack
        label: Tech Stack (optional)
        type: string
        list: true
      - name: features
        label: Highlights (optional)
        type: string
        list: true
      - name: body
        label: README Markdown
        type: rich-text
