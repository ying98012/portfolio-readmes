media:
  input: assets/uploads
  output: /uploads

content:
  - name: home
    label: Home
    type: file
    path: index.md
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: heroEyebrow
        label: Hero Eyebrow
        type: string
        required: true
      - name: heroDescription
        label: Hero Description
        type: text
        required: true
      - name: primaryButtonLabel
        label: Primary Button Label
        type: string
        required: true
      - name: primaryButtonUrl
        label: Primary Button URL
        type: string
        required: true
      - name: secondaryButtonLabel
        label: Secondary Button Label
        type: string
        required: true
      - name: secondaryButtonUrl
        label: Secondary Button URL
        type: string
        required: true
      - name: listTitle
        label: List Title
        type: string
        required: true
      - name: listDescription
        label: List Description
        type: text
        required: true
      - name: body
        label: Notes
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: "{fields.slug}"
    view:
      fields: [title, updatedAt]
      primary: title
      sort: [updatedAt, desc]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: techStack
        label: Tech Stack
        type: string
        list: true
        required: true
      - name: features
        label: Highlights
        type: string
        list: true
        required: true
      - name: videoUrl
        label: Video URL
        type: string
      - name: projectUrl
        label: Portfolio Project URL
        type: string
        required: true
      - name: updatedAt
        label: Updated At
        type: date
        required: true
      - name: body
        label: README Content
        type: rich-text
